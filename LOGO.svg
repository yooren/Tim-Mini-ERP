<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tim Mini ERP">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b6eff"/>
      <stop offset="100%" stop-color="#5b4eff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="192" height="192" rx="44" fill="url(#bg)"/>
  <rect x="4" y="4" width="192" height="192" rx="44" fill="url(#sheen)"/>

  <!-- T monogram, built from primitives so it renders identically everywhere -->
  <g>
    <rect x="52" y="56" width="96" height="24" rx="12" fill="#ffffff"/>
    <rect x="88" y="56" width="24" height="92" rx="12" fill="#ffffff"/>
  </g>

  <!-- accent spark: nods to "做更顺手的工具" without cluttering the mark -->
  <circle cx="140" cy="146" r="9" fill="#ffd166"/>
</svg>
